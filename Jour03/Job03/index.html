<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h2>Pokemon List</h2>

    <form id="filter-form">
        <label for="id">ID:</label>
        <input type="text" id="pokemon-id" placeholder="Enter Pokémon id" required>

        <label for="name">Name:</label>
        <input type="text" id="pokemon-name" placeholder="Enter Pokémon name" required>

        <label for="type">Type:</label>
        <select id="type" name="type">
        <option value="">Tous</option>
        <option value="Grass">Grass</option>
        <option value="Poison">Poison</option>
        <option value="Fire">Fire</option>
        <option value="Flying">Flying</option>
        <option value="Water">Water</option>
        <option value="Bug">Bug</option>
        <option value="Normal">Normal</option>
        <option value="Electric">Electric</option>
        <option value="Ground">Ground</option>
        <option value="Fairy">Fairy</option>
        <option value="Fighting">Fighting</option>
        <option value="Psychic">Psychic</option>
        <option value="Rock">Rock</option>
        <option value="Steel">Steel</option>
        <option value="Ice">Ice</option>
        <option value="Ghost">Ghost</option>
        <option value="Dragon">Dragon</option>

        
        <label for="base">Base:</label>
        <input type="text" id="pokemon-base" placeholder="Enter Pokémon base" required>


        <input type="button" id="filterButton" value="Filtrer">
    </form>

    <div id="results"></div>

    <script src="script.js"></script>
    
</body>
</html>
